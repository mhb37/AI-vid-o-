<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fruit Tales Studio — Viral Long Film</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a12;--bg2:#12121c;--bg3:#1a1a28;
--panel:#16161f;--border:#2a2a3a;
--ink:#e8e6e0;--dim:#8a8896;--faint:#4a4858;
--acc:#e5c15a;--acc2:#e87b35;--ok:#4a9d6a;--err:#c85a4a;--warn:#d4a017;
--r:8px;--fs:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
--fm:ui-monospace,'SF Mono',Menlo,monospace;
}
html,body{background:var(--bg)}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);min-height:100vh;padding:1rem .8rem 24rem;font-size:14px;line-height:1.55;max-width:720px;margin:0 auto}
header{margin-bottom:1rem;text-align:center;padding:.8rem 0 1rem;position:relative}
header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:160px;height:1px;background:linear-gradient(90deg,transparent,var(--acc2),var(--acc2),transparent);opacity:.6}
h1{font-size:1.6rem;font-weight:300;margin-bottom:.3rem;background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:.75rem;color:var(--dim);font-style:italic}
.banner{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--acc2);padding:.8rem .9rem;border-radius:var(--r);font-size:.75rem;color:var(--dim);margin-bottom:1rem;line-height:1.6}
.banner strong{color:var(--ink)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:1rem;margin-bottom:.8rem}
.panel.ok{box-shadow:inset 3px 0 0 var(--ok)}
input[type=password],input[type=url],textarea,select{width:100%;padding:.8rem .9rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--ink);font-family:var(--fs);font-size:.88rem;margin-bottom:.5rem}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc2)}
.btn{width:100%;padding:.8rem 1rem;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--ink);font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-bottom:.5rem;transition:all .2s;font-family:inherit}
.btn:hover:not(:disabled){background:var(--bg3);border-color:var(--acc2)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{border-color:var(--acc2);background:linear-gradient(135deg,rgba(232,123,53,.18),rgba(229,193,90,.12));color:var(--acc2);font-size:.95rem;padding:1.2rem;letter-spacing:.15em}
.btn-secondary{border-color:var(--warn);color:var(--warn);background:rgba(212,160,23,.08);font-size:.75rem}
.btn-stop{border-color:var(--err);color:var(--err);background:transparent;display:none}
.btn-stop.visible{display:block}
.status{font-size:.72rem;padding:.5rem .8rem;border-radius:var(--r);margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem;background:var(--bg2);color:var(--dim);border:1px solid var(--border)}
.status.ok{background:rgba(74,157,106,.08);color:var(--ok);border-color:rgba(74,157,106,.3)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex-shrink:0}
.status.ok .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.hint{font-size:.68rem;color:var(--dim);margin-top:.4rem}
.quota-line{font-size:.7rem;padding:.5rem .7rem;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);margin-top:.4rem;color:var(--dim);font-family:var(--fm);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.4rem}
.quota-line .q-val{color:var(--acc2);font-weight:600}
.section{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.8rem;overflow:hidden}
.section.hidden{display:none!important}
.section-header{padding:.8rem 1rem;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.15em;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.badge{display:inline-block;padding:.12rem .45rem;background:transparent;color:var(--acc2);border:1px solid var(--border);border-radius:2px;font-size:.58rem;letter-spacing:.12em;font-weight:600}
.chevron{font-size:.65rem;color:var(--faint);transition:transform .3s}
.section.open .chevron{transform:rotate(180deg);color:var(--acc2)}
.section-body{max-height:0;overflow:hidden;transition:max-height .4s ease}
.section.open .section-body{max-height:12000px}
.section-content{padding:0 1rem 1rem}
.control-row{margin-bottom:.9rem}
.control-label{display:block;font-size:.7rem;color:var(--dim);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.story-view{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.8rem;margin-top:.4rem;font-size:.8rem;line-height:1.6;max-height:420px;overflow-y:auto}
.env-card{background:rgba(232,123,53,.06);border-radius:var(--r);padding:.5rem .7rem;margin-bottom:.6rem;font-size:.72rem;border-left:2px solid var(--acc2);color:var(--dim);font-family:var(--fm)}
.character-card{background:var(--bg3);border-radius:var(--r);padding:.5rem .7rem;margin-bottom:.4rem;font-size:.75rem;border-left:2px solid var(--acc2)}
.scene-block{margin-bottom:.8rem;padding-left:.7rem;border-left:2px solid var(--border)}
.scene-block .sc-head{font-size:.7rem;color:var(--acc2);font-weight:600;margin-bottom:.25rem}
.clip-list{display:flex;flex-direction:column;gap:.5rem;margin-top:.6rem}
.clip-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:.6rem;display:flex;gap:.6rem;align-items:center}
.clip-card.done{border-color:var(--ok)}
.clip-card.error{border-color:var(--err)}
.clip-card.generating{border-color:var(--acc2)}
.clip-index{font-family:var(--fm);font-size:.7rem;color:var(--acc2);font-weight:700;flex-shrink:0;width:30px}
.clip-body{flex:1;font-size:.72rem;color:var(--dim)}
.clip-body video{width:100%;max-width:140px;border-radius:4px;margin-top:.3rem;display:block}
.clip-status{font-size:.65rem;flex-shrink:0}
.progress-bar-container{background:var(--bg2);border-radius:99px;height:8px;overflow:hidden;margin:.6rem 0}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s;border-radius:99px}
.progress-text{font-size:.72rem;color:var(--dim);text-align:center;font-family:var(--fm)}
.ref-image{width:100%;max-width:280px;border-radius:8px;margin-top:.5rem;display:block;border:1px solid var(--border)}
.spinner-mini{width:12px;height:12px;border:2px solid rgba(232,123,53,.2);border-top-color:var(--acc2);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:.3rem}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:12px;height:12px;border:2px solid rgba(232,123,53,.2);border-top-color:var(--acc2);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
.status-bar{position:fixed;bottom:200px;left:0;right:0;background:var(--bg3);border-top:1px solid var(--border);color:var(--ink);padding:.65rem 1rem;font-size:.72rem;display:flex;align-items:center;gap:.6rem;transform:translateY(200%);transition:transform .35s;z-index:150;font-family:var(--fm);box-shadow:0 -4px 20px rgba(0,0,0,.4)}
.status-bar.visible{transform:translateY(0)}
.debug-panel{position:fixed;bottom:0;left:0;right:0;height:190px;background:#05050a;border-top:2px solid var(--acc2);z-index:200;display:flex;flex-direction:column;font-family:var(--fm);box-shadow:0 -8px 32px rgba(0,0,0,.7);transition:height .3s ease}
.debug-panel.collapsed{height:36px}
.debug-header{display:flex;justify-content:space-between;align-items:center;padding:.35rem .6rem;background:linear-gradient(90deg,#0f0f18,#1a1a28);border-bottom:1px solid var(--border);flex-shrink:0;user-select:none}
.debug-tabs{display:flex;gap:.2rem}
.debug-tab{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:.62rem;padding:.3rem .6rem;border-radius:3px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-family:inherit}
.debug-tab.active{color:var(--acc2);border-color:var(--acc2);background:rgba(232,123,53,.08)}
.debug-actions{display:flex;gap:.25rem}
.debug-actions button{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:.58rem;padding:.25rem .5rem;border-radius:2px;cursor:pointer;font-family:inherit}
.debug-body{flex:1;overflow-y:auto;padding:.5rem .7rem .8rem;font-size:.7rem;line-height:1.5;color:#c8c8d0}
.debug-body.hidden{display:none}
.journal-body .j-entry{display
